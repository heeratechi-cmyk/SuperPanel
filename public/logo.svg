<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" stroke="#7e22ce" stroke-width="2.5" />
  
  <!-- Glowing S Emblem -->
  <path d="M 62 28 C 62 28, 42 22, 36 32 C 30 42, 68 44, 62 62 C 56 80, 32 72, 32 72" 
        fill="none" 
        stroke="url(#iconGrad)" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
  
  <!-- Sparkle accent -->
  <circle cx="68" cy="28" r="4" fill="#38bdf8" />
  <circle cx="30" cy="70" r="3" fill="#a855f7" />
</svg>
